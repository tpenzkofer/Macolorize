name: Macolorize
options:
  bundleIdPrefix: com.penzkofer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    DEAD_CODE_STRIPPING: YES
    # Apple Silicon only: the pipeline uses Float16 and the ANE.
    ARCHS: arm64

targets:
  MacolorizeCore:
    type: library.static
    platform: macOS
    sources:
      - path: Macolorize/Pipeline
        optional: true
      - path: Macolorize/ML
        optional: true
      - path: Macolorize/IO
        optional: true
      - path: Macolorize/Batch
        optional: true

  Macolorize:
    type: application
    platform: macOS
    sources:
      - path: Macolorize/App
      - path: Macolorize/UI
      - path: Macolorize/Resources
        optional: true
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    dependencies:
      - target: MacolorizeCore
    info:
      path: Macolorize/Info.plist
      properties:
        CFBundleDisplayName: Macolorize
        CFBundleShortVersionString: "1.2.4"
        CFBundleVersion: "1.2.4"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: ""
    entitlements:
      path: Macolorize/Macolorize.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          # Developer ID distribution signing with secure timestamp.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: ZM6YGES9JH
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Never embed the debugger entitlement in distribution builds
          # (notarization rejects get-task-allow).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  MacolorizeCLI:
    type: tool
    platform: macOS
    sources:
      - path: MacolorizeCLI
    dependencies:
      - target: MacolorizeCore
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  MacolorizeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacolorizeTests
    dependencies:
      - target: MacolorizeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Macolorize:
    build:
      targets:
        Macolorize: all
        MacolorizeCLI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacolorizeTests
  MacolorizeCLI:
    build:
      targets:
        MacolorizeCLI: all
    run:
      config: Debug
